name: Deploy GitHub release bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag and release to update
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/deploy-github-release.mjs "$RELEASE_TAG"
      - name: Make the Git repository installable
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/sync-git-bundle.mjs "$RELEASE_TAG"
          npm pack --ignore-scripts --pack-destination /tmp --json > /tmp/voicemesh-git-package.json
          git add package.json lib locale cordis.patch.yml provenance.json NOTICE THIRD_PARTY_LICENSES
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Bundle ${RELEASE_TAG} for Git installation"
            git push origin HEAD:main
          fi
