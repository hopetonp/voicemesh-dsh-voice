name: Deploy GitHub release bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag and release to update
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/deploy-github-release.mjs "$RELEASE_TAG"
